[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boneohio-research-bundle"
version = "0.1.0"
description = "Portable public BoneOhio strategy research data and reference execution engines"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas==2.3.3", "pyarrow==23.0.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
